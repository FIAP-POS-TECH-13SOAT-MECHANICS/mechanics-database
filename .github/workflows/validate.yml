name: Validate Infrastructure

on:
  workflow_call:
    inputs:
      services:
        description: JSON array of service objects (name, path)
        required: true
        type: string

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJson(inputs.services) }}
    steps:
      - uses: actions/checkout@v5
      - uses: FIAP-POS-TECH-13SOAT-MECHANICS/mechanics-infra/.github/actions/validate-terraform-module@main
        with:
          module_name: ${{ matrix.service.name }}
          module_path: ${{ matrix.service.path }}
