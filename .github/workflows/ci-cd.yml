name: CI/CD Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - release
      - develop

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  resolve-environment:
    name: Resolve environment name
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Resolve Environment
        id: resolve
        uses: FIAP-POS-TECH-13SOAT-MECHANICS/mechanics-infra/.github/actions/resolve-environment@main

  terraform:
    name: Apply infrastructure
    needs:
      - resolve-environment
    uses: ./.github/workflows/infra.yml
    with:
      environment: ${{ needs.resolve-environment.outputs.environment }}
    secrets: inherit
